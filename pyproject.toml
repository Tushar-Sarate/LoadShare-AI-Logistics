[project]
name = "loadshare-ai-logistics"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt<4.1",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.20",
    "numpy>=2.5.4",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
