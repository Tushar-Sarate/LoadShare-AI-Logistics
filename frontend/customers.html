<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadShare AI Logistics - Customer Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <span class="brand">LoadShare AI Logistics</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="orders.html">Orders</a>
    <a href="partners.html">Partners</a>
    <a href="customers.html">Customers</a>
    <a href="chatbot.html">Chatbot</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="container">

    <div class="card">
      <h2>My Customer Profile</h2>
      <p id="profile-info">Loading...</p>
    </div>

    <div class="card">
      <h2 id="form-title">Create Profile</h2>
      <input type="text" id="phone" placeholder="Phone (10 digits)">
      <input type="text" id="address" placeholder="Address">
      <input type="text" id="city" placeholder="City">
      <input type="text" id="pincode" placeholder="Pincode (6 digits)">
      <button onclick="saveProfile()">Save Profile</button>
      <p class="msg" id="profile-msg"></p>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    requireLogin();

    let hasProfile = false;

    async function loadProfile() {
      const info = document.getElementById("profile-info");
      try {
        const p = await api("/customers/profile");
        hasProfile = true;
        info.textContent =
          "Phone: " + p.phone + " | Address: " + p.address +
          " | City: " + p.city + " | Pincode: " + p.pincode;
        document.getElementById("form-title").textContent = "Update Profile";
        document.getElementById("phone").value = p.phone || "";
        document.getElementById("address").value = p.address || "";
        document.getElementById("city").value = p.city || "";
        document.getElementById("pincode").value = p.pincode || "";
      } catch (e) {
        hasProfile = false;
        info.textContent = e.message;
      }
    }

    async function saveProfile() {
      const msg = document.getElementById("profile-msg");
      const data = {
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        pincode: document.getElementById("pincode").value,
      };
      try {
        await api("/customers/profile", hasProfile ? "PATCH" : "POST", data);
        msg.className = "msg success";
        msg.textContent = "Profile saved";
        loadProfile();
      } catch (e) {
        msg.className = "msg error";
        msg.textContent = e.message;
      }
    }

    loadProfile();
  </script>

</body>
</html>
