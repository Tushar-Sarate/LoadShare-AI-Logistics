<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadShare AI Logistics - Chatbot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <span class="brand">LoadShare AI Logistics</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="orders.html">Orders</a>
    <a href="partners.html">Partners</a>
    <a href="customers.html">Customers</a>
    <a href="chatbot.html">Chatbot</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="container">

    <div class="card">
      <h2>Support Chatbot</h2>
      <div id="chat-box"></div>
      <input type="text" id="question" placeholder="Ask about charges, refunds, orders..."
             onkeydown="if (event.key === 'Enter') sendQuestion()">
      <button onclick="sendQuestion()">Send</button>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    requireLogin();

    function addBubble(text, type) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = "bubble " + type;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function sendQuestion() {
      const input = document.getElementById("question");
      const question = input.value.trim();
      if (question.length < 2) return;

      addBubble(question, "user");
      input.value = "";

      const waiting = addBubble("Typing...", "bot");

      try {
        const data = await api("/chatbot/", "POST", { question: question });
        waiting.textContent = data.answer;
      } catch (e) {
        waiting.textContent = "Error: " + e.message;
      }
    }

    addBubble("Hello! Ask me about delivery charges, refunds, rules or your order.", "bot");
  </script>

</body>
</html>
